# GoogleTest needs a hosted C++17 library: libstdc++ from the toolchain.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# The tests run on the main thread. A contract test's harness keeps its
# buffers on the stack, and the default 1 KiB stack overflowed into other
# memory without a fault. The image prints how much it used (src/main.cpp);
# the size leaves room over that.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_STACK_SENTINEL=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y
