# native_sim's UARTs (zephyr,native-pty-uart) can be interrupt-driven, so
# the UART backends (io_zephyr_uart, ring_zephyr_uart) and their tests
# against a scripted device build and run here too. The first UART is the
# console now, and stays on the process's stdin and stdout, which Twister
# reads.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y
