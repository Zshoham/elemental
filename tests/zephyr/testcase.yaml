# Run with Twister; see docs/build.md, "Tests on Zephyr".
common:
  tags: elemental
tests:
  # Every Elemental test, in one image. nucleo_g0b1re_renode is a
  # Cortex-M0+ (ARMv6-M) under Renode, defined in boards/; pass
  # --board-root <this directory>/boards to Twister.
  elemental.tests:
    harness: gtest
    platform_allow:
      - native_sim
      - mps2/an385
      - nucleo_g0b1re_renode
    integration_platforms:
      - native_sim
      - mps2/an385
      - nucleo_g0b1re_renode
  # The host presets' other configurations, on one Arm board: every
  # non-default Kconfig choice, and contract assertions compiled out.
  elemental.tests.variant:
    harness: gtest
    extra_args: ELEMENTAL_ZEPHYR_VARIANT=variant
    platform_allow:
      - mps2/an385
    integration_platforms:
      - mps2/an385
  elemental.tests.assert_off:
    harness: gtest
    extra_args: ELEMENTAL_ZEPHYR_VARIANT=assert_off
    platform_allow:
      - mps2/an385
    integration_platforms:
      - mps2/an385
  # ARMv6-M on a small board: no hardware divide, no ldrex/strex. The test
  # image needs more memory than this board has, so only the libraries are
  # built, and the build fails if they need a symbol outside
  # allowed-undefined.txt. The cheapest ARMv6-M check: no emulator needed.
  elemental.symbols.armv6m:
    build_only: true
    extra_args: ELEMENTAL_ZEPHYR_TESTS=OFF
    platform_allow:
      - qemu_cortex_m0
    integration_platforms:
      - qemu_cortex_m0
