# Run with Twister; see docs/build.md, "Tests on Zephyr".
common:
  tags: elemental
tests:
  # One image per module: each module's tests (examples with the module they
  # test), so that a failing module is its own scenario and every image
  # fits the smallest board (CMakeLists.txt, ELEMENTAL_TEST_MODULE).
  # nucleo_g0b1re_renode is a Cortex-M0+ (ARMv6-M) under Renode, defined in
  # boards/; pass --board-root <this directory>/boards to Twister. Each Arm
  # image builds every library and runs the symbol check.
  elemental.tests.status:
    harness: gtest
    extra_args: ELEMENTAL_TEST_MODULE=status
    platform_allow:
      - native_sim
      - mps2/an385
      - nucleo_g0b1re_renode
    integration_platforms:
      - native_sim
      - mps2/an385
      - nucleo_g0b1re_renode
  elemental.tests.alloc:
    harness: gtest
    extra_args: ELEMENTAL_TEST_MODULE=alloc
    platform_allow:
      - native_sim
      - mps2/an385
      - nucleo_g0b1re_renode
    integration_platforms:
      - native_sim
      - mps2/an385
      - nucleo_g0b1re_renode
  elemental.tests.io:
    harness: gtest
    extra_args: ELEMENTAL_TEST_MODULE=io
    platform_allow:
      - native_sim
      - mps2/an385
      - nucleo_g0b1re_renode
    integration_platforms:
      - native_sim
      - mps2/an385
      - nucleo_g0b1re_renode
  elemental.tests.fmt:
    harness: gtest
    extra_args: ELEMENTAL_TEST_MODULE=fmt
    platform_allow:
      - native_sim
      - mps2/an385
      - nucleo_g0b1re_renode
    integration_platforms:
      - native_sim
      - mps2/an385
      - nucleo_g0b1re_renode
  elemental.tests.bytes:
    harness: gtest
    extra_args: ELEMENTAL_TEST_MODULE=bytes
    platform_allow:
      - native_sim
      - mps2/an385
      - nucleo_g0b1re_renode
    integration_platforms:
      - native_sim
      - mps2/an385
      - nucleo_g0b1re_renode
  elemental.tests.crc:
    harness: gtest
    extra_args: ELEMENTAL_TEST_MODULE=crc
    platform_allow:
      - native_sim
      - mps2/an385
      - nucleo_g0b1re_renode
    integration_platforms:
      - native_sim
      - mps2/an385
      - nucleo_g0b1re_renode
  # The host presets' other configurations, on one Arm board, each as one
  # image with every test: one non-default option of each Kconfig choice,
  # and contract assertions compiled out.
  elemental.tests.variant:
    harness: gtest
    extra_args: ELEMENTAL_ZEPHYR_VARIANT=variant
    # FMT_PRINTF_LIBC needs a printf that converts long long
    # (PLATFORM_SNPRINTF). Zephyr's default picolibc level does today;
    # stated, not relied on. Floats are not at this level: fmt.libc's float
    # cases run only with CONFIG_PICOLIBC_IO_FLOAT.
    extra_configs:
      - CONFIG_PICOLIBC_IO_LONG_LONG=y
    platform_allow:
      - mps2/an385
    integration_platforms:
      - mps2/an385
  # The fmt image with the variant configuration on the Cortex-M0+, so that
  # the libc printf option (FMT_PRINTF_LIBC) runs on ARMv6-M as well as on
  # the Cortex-M3 above.
  elemental.tests.fmt.variant:
    harness: gtest
    extra_args:
      - ELEMENTAL_TEST_MODULE=fmt
      - ELEMENTAL_ZEPHYR_VARIANT=variant
    extra_configs:
      - CONFIG_PICOLIBC_IO_LONG_LONG=y
    platform_allow:
      - nucleo_g0b1re_renode
    integration_platforms:
      - nucleo_g0b1re_renode
  elemental.tests.assert_off:
    harness: gtest
    extra_args: ELEMENTAL_ZEPHYR_VARIANT=assert_off
    platform_allow:
      - mps2/an385
    integration_platforms:
      - mps2/an385
  # CRC_ZEPHYR, the one choice option no host can select: crc's tests run
  # through Zephyr's crc32_ieee_update() and crc16_itu_t().
  elemental.tests.crc_zephyr:
    harness: gtest
    extra_args: ELEMENTAL_ZEPHYR_VARIANT=crc_zephyr
    extra_configs:
      - CONFIG_CRC=y
    platform_allow:
      - mps2/an385
    integration_platforms:
      - mps2/an385
  # ARMv6-M on a small board: no hardware divide, no ldrex/strex. The test
  # image needs more memory than this board has, so only the libraries are
  # built, and the build fails if they need a symbol outside
  # allowed-undefined.txt. The cheapest ARMv6-M check: no emulator needed.
  elemental.symbols.armv6m:
    build_only: true
    extra_args: ELEMENTAL_ZEPHYR_TESTS=OFF
    platform_allow:
      - qemu_cortex_m0
    integration_platforms:
      - qemu_cortex_m0
