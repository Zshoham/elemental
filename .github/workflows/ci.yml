# Reproduces the checks a developer runs locally (docs/build.md). Each hosted
# job is one preset: configure, build, test. The zephyr job runs the Zephyr
# test application under Twister.
#
# Actions are pinned to a commit; the tag is in the comment.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Ubuntu 24.04's own GCC and Clang, with warnings as errors (the presets
  # set ELEMENTAL_WARNINGS_AS_ERRORS). These are older than the compilers
  # the project is developed with.
  hosted:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [gcc, clang, sanitize, assert-off]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake ninja-build gcc g++ clang python3 python3-dev
          gcc --version | head -n 1
          clang --version | head -n 1

      # The only step that uses the network for dependencies. Everything
      # after it runs from the checkouts this leaves in .deps/.
      - name: Provision the pinned Kconfiglib fork and GoogleTest
        run: cmake -P tools/provision.cmake

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  minimum-cmake:
    name: cmake 3.22 (declared minimum)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ninja-build gcc g++ python3 python3-venv
          python3 -m venv "$RUNNER_TEMP/cmake"
          "$RUNNER_TEMP/cmake/bin/pip" install 'cmake==3.22.*'
          echo "$RUNNER_TEMP/cmake/bin" >> "$GITHUB_PATH"

      - name: Provision the pinned Kconfiglib fork and GoogleTest
        run: cmake -P tools/provision.cmake

      - name: Configure, build, test
        run: |
          cmake --version
          cmake --preset gcc
          cmake --build --preset gcc
          ctest --preset gcc

  # Python 3.9 is the stated minimum (docs/build.md). It is first on PATH,
  # so every configure, the integration tests' included, runs Kconfig with it.
  minimum-python:
    name: python 3.9 (declared minimum)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.9'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake ninja-build gcc g++

      - name: Provision the pinned Kconfiglib fork and GoogleTest
        run: cmake -P tools/provision.cmake

      - name: Configure, build, test
        run: |
          python3 --version
          cmake --preset gcc -DPython3_EXECUTABLE="$(command -v python3)"
          cmake --build --preset gcc
          ctest --preset gcc

  # Elemental's tests on Zephyr: native_sim, mps2/an385 (Cortex-M3) under
  # QEMU, nucleo_g0b1re_renode (Cortex-M0+, a modified model) under Renode,
  # and the symbol check on every ARM board, qemu_cortex_m0 included
  # (tests/zephyr/testcase.yaml). The workspace is the one docs/build.md
  # describes: a pinned Zephyr, only the modules these boards need, the SDK
  # with only the Arm toolchain, and Renode's portable release.
  zephyr:
    name: zephyr (twister)
    runs-on: ubuntu-24.04
    env:
      ZEPHYR_REVISION: v4.5.0
      ZEPHYR_COMMIT: 41d10b59730406bbab4ca9f1fbbe9e96aafb4966
      WEST_PROJECT_FILTER: '-.*,+cmsis,+cmsis_6,+picolibc,+hal_nordic,+hal_stm32'
      ZEPHYR_SDK_VERSION: 1.0.1
      RENODE_VERSION: 1.17.0
      RENODE_SHA256: 4ba7c68b59e2447f188ef4b4b112fcccd2802582c460beedceb63b84e5605a5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # gcc-multilib: native_sim is a 32-bit host program. QEMU, dtc, and
      # gperf come from Ubuntu rather than from the SDK's host tools.
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake ninja-build gperf device-tree-compiler \
            gcc-multilib g++-multilib qemu-system-arm
          pip install west
          echo "ZEPHYR_SDK_INSTALL_DIR=$HOME/zephyrproject/zephyr-sdk-$ZEPHYR_SDK_VERSION" >> "$GITHUB_ENV"
          echo "$HOME/zephyrproject/renode" >> "$GITHUB_PATH"

      # The key changes with the pins above, which live in this file.
      - name: Restore the Zephyr workspace
        id: workspace
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/zephyrproject
          key: zephyr-${{ env.ZEPHYR_COMMIT }}-sdk-${{ env.ZEPHYR_SDK_VERSION }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Create the Zephyr workspace
        if: steps.workspace.outputs.cache-hit != 'true'
        run: |
          west init -m https://github.com/zephyrproject-rtos/zephyr \
            --mr "$ZEPHYR_REVISION" ~/zephyrproject
          cd ~/zephyrproject
          test "$(git -C zephyr rev-parse HEAD)" = "$ZEPHYR_COMMIT"
          west config manifest.project-filter -- "$WEST_PROJECT_FILTER"
          west update --narrow -o=--depth=1

      # The SDK command imports packages from requirements-base.txt. Install
      # the requirements on cache hits too: the Python environment is fresh.
      - name: Install Zephyr's Python requirements
        run: |
          cd ~/zephyrproject/zephyr
          pip install -r scripts/requirements-base.txt \
            -r scripts/requirements-build-test.txt \
            -r scripts/requirements-run-test.txt

      - name: Install the Zephyr SDK and Renode
        if: steps.workspace.outputs.cache-hit != 'true'
        run: |
          cd ~/zephyrproject
          west sdk install --version "$ZEPHYR_SDK_VERSION" \
            -t arm-zephyr-eabi -H -d "$ZEPHYR_SDK_INSTALL_DIR"
          archive="renode-$RENODE_VERSION.linux-portable.tar.gz"
          curl -fsSLO "https://github.com/renode/renode/releases/download/v$RENODE_VERSION/$archive"
          echo "$RENODE_SHA256  $archive" | sha256sum -c
          mkdir renode
          tar -xzf "$archive" -C renode --strip-components=1
          rm "$archive"

      - name: Provision the pinned Kconfiglib fork and GoogleTest
        run: cmake -P tools/provision.cmake

      - name: Twister
        run: |
          cd ~/zephyrproject/zephyr
          renode --version
          west twister -T "$GITHUB_WORKSPACE/tests/zephyr" \
            --board-root "$GITHUB_WORKSPACE/tests/zephyr/boards" --integration \
            -O "$RUNNER_TEMP/twister-out" --inline-logs
